<script>
const map = L.map('map').setView([34.17,132.22],15);
let addHydrantMode = false;

document.getElementById("addHydrantButton").addEventListener("click", function() {
  addHydrantMode = true;
  alert("地図上の消火栓の場所をクリックしてください");
});

map.on("click", function(e) {
  if (!addHydrantMode) return;

  const lat = e.latlng.lat;
  const lng = e.latlng.lng;
　window.newHydrantLocation = { lat, lng };
  L.marker([lat, lng])
  .addTo(map)
    .bindPopup("新しい消火栓")
    .openPopup();

  addHydrantMode = false;
});
L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }
).addTo(map);

function showLocation() {
  if (!navigator.geolocation) {
    alert('現在地を取得できません');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      map.setView([lat,lng],18);

     L.marker([lat,lng])
  .addTo(map)
        .bindPopup('現在地')
        .openPopup();
    },
    function() {
      alert('現在地を取得できませんでした。位置情報を許可してください。');
    }
  );
}

async function createWaterSourceIfAbsent(record) {
  const recordRef = doc(db, importCollection, record.importId);
  const versionRef = doc(db, "water_metadata", "version");

  return await runTransaction(db, async (transaction) => {
    const existing = await transaction.get(recordRef);

    if (existing.exists()) {
      return false;
    }

    transaction.set(recordRef, {
      name: record.name,
      type: record.type,
      status: record.status,
      lat: record.lat,
      lng: record.lng
    });

    transaction.update(versionRef, {
      updatedAt: serverTimestamp()
    });

    return true;
  });
}

window.moveHydrant = function(id) {
  if (!canEditWaterSources) {
    alert("位置を訂正する権限がありません");
    return;
  }

  map.closePopup();

  alert("地図上の新しい位置をクリックしてください");

  map.once("click", async function(e) {
    const lat = e.latlng.lat;
    const lng = e.latlng.lng;

    if (!confirm("この位置に変更しますか？")) {
      return;
    }

    try {
      const batch = writeBatch(db);

      batch.update(doc(db, "water_sources", id), {
        lat: lat,
        lng: lng
      });

      batch.update(doc(db, "water_metadata", "version"), {
        updatedAt: serverTimestamp()
      });

      await batch.commit();

      localStorage.removeItem(WATER_CACHE_KEY);

      alert("位置を訂正しました");
      location.reload();

    } catch (error) {
      alert("位置を保存できませんでした：" + error.message);
    }
  });
};  
window.editHydrant = async function(id, oldName) {
  const newName = prompt(
    "新しい消火栓の名前を入力してください",
    oldName
  );

  if (newName === null || newName.trim() === "") return;

  try {
    const batch = writeBatch(db);

    batch.update(doc(db, "water_sources", id), {
      name: newName.trim()
    });

    batch.update(doc(db, "water_metadata", "version"), {
      updatedAt: serverTimestamp()
    });

    await batch.commit();

    localStorage.removeItem(WATER_CACHE_KEY);

    alert("消火栓の名前を保存しました");
    location.reload();

  } catch (error) {
    alert("保存できませんでした：" + error.message);
  }
};

document.getElementById("deleteKmlButton").addEventListener("click", async () => {
  if (!auth.currentUser || !isAdminUser) {
    alert("管理者だけが削除できます");
    return;
  }

  try {
    const snapshot = await getDocs(collection(db, "water_sources"));

    const targets = snapshot.docs.filter(item =>
      item.id.startsWith("marifu_kml_")
    );

    if (targets.length === 0) {
      alert("削除対象のKMLデータはありません");
      return;
    }

    alert("削除対象は " + targets.length + " 件です");

    if (!confirm(
      "KMLデータ " + targets.length +
      " 件を削除します。\n本当によろしいですか？"
    )) {
      return;
    }

    if (!confirm(
      "最終確認です。\n削除したデータは元に戻せません。\n削除しますか？"
    )) {
      return;
    }

    let deleted = 0;

   
const batchSize = 200;

for (let i = 0; i < targets.length; i += batchSize) {
  const batch = writeBatch(db);
  const group = targets.slice(i, i + batchSize);

  for (const item of group) {
    batch.delete(doc(db, "water_sources", item.id));
  }

  batch.update(doc(db, "water_metadata", "version"), {
    updatedAt: serverTimestamp()
  });

  try {
    await batch.commit();
    deleted += group.length;
  } catch (error) {
    alert(
      "削除を停止しました。\n" +
      "削除済み：" + deleted + " 件\n" +
      "エラー：" + error.message
    );
    return;
  }
}

localStorage.removeItem(WATER_CACHE_KEY);

    alert("KMLデータ " + deleted + " 件を削除しました");
    window.location.reload();

  } catch (error) {
    alert("削除処理エラー：" + error.message);
  }
});

  const WATER_CACHE_KEY = "marifu_water_sources_v1";
  const WATER_CACHE_DURATION = 24 * 60 * 60 * 1000;

function saveWaterCache(data, version = null) {
  try {
    localStorage.setItem(
      WATER_CACHE_KEY,
      JSON.stringify({
        savedAt: new Date().toISOString(),
        version: version,
        sources: data
      })
    );
  } catch (error) {
    console.error("水利データの保存に失敗:", error);
  }
}

function getWaterCache() {
  try {
    const saved = localStorage.getItem(WATER_CACHE_KEY);
    return saved ? JSON.parse(saved) : null;
  } catch (error) {
    console.error("保存データの読み込みに失敗:", error);
    return null;
  }
}

      const type = data.type || "1";

      const lat = Number(data.lat);
　　　const lng = Number(data.lng);

if (!Number.isFinite(lat) || !Number.isFinite(lng) ||
    Math.abs(lat) > 90 || Math.abs(lng) > 180) {
  return;
}
     

     const marker = L.circleMarker([lat, lng], {
  radius: 9,
　color: status === "0" ? "white" : status === "3" ? "black" : status === "2" ? "yellow" : type === "2" ? "blue" : type === "3" ? "green" : "red",

})
  .addTo(map)
       .bindPopup(

 status === "2" ? "使用注意" :

 (canEditWaterSources
  ? '<br><button type="button" onclick="editHydrant(\'' + doc.id + '\', \'' + (data.name || "").replace(/'/g, "\\'") + '\')">訂正</button>'

  async function loadWaterSources() {
  try {
　   const cached = getWaterCache();

    const versionSnap = await getDoc(
      doc(db, "water_metadata", "version")
    );

    if (!versionSnap.exists()) {
      throw new Error("水利データの更新情報がありません");
    }

    const updatedAt = versionSnap.data().updatedAt;

    if (!updatedAt || typeof updatedAt.toMillis !== "function") {
      throw new Error("更新日時を読み取れません");
    }

    const currentVersion = updatedAt.toMillis();

    
   
const cacheIsValid =
  cached &&
  Array.isArray(cached.sources) &&
  cached.sources.length > 0 &&
  cached.version === currentVersion;

        if (cacheIsValid) {
      console.log("保存済みの水利データを使用します");
      searchWaterSources = cached.sources;
      displayWaterSources(searchWaterSources);
      return;
    }


    if (cached && Array.isArray(cached.sources)) {
      console.log(
        "スマホに保存された水利データ:",
        cached.sources.length,
        "件"
      );
      console.log("保存日時:", cached.savedAt);
    }

    const snapshot = await getDocs(collection(db, "water_sources"));
searchWaterSources = snapshot.docs.map(item => ({
  id: item.id,
  ...item.data()
}));
        

const versionCheckSnap = await getDoc(
  doc(db, "water_metadata", "version")
);

if (!versionCheckSnap.exists()) {
  throw new Error("更新情報が見つかりません");
}

const checkedAt = versionCheckSnap.data().updatedAt;

if (!checkedAt || typeof checkedAt.toMillis !== "function") {
  throw new Error("更新日時を確認できません");
}

if (checkedAt.toMillis() !== currentVersion) {
  throw new Error(
    "水利データの読み込み中に更新がありました。再読み込みしてください。"
  );
}

saveWaterCache(searchWaterSources, currentVersion);



    displayWaterSources(searchWaterSources);

 if (layer instanceof L.Marker || layer instanceof L.CircleMarker) {
