const map = L.map('map').setView([34.17,132.22],15);

let addHydrantMode = false;

document.getElementById("addHydrantButton").addEventListener("click", function() {
  if (!window.canEditNow || !window.canEditNow()) return;
  addHydrantMode = true;

  alert("地図上の消火栓の場所をクリックしてください");
});



map.on("click", function(e) {
  if (!addHydrantMode) return;

  if (!window.canEditNow || !window.canEditNow()) {
    addHydrantMode = false;
    window.newHydrantLocation = null;
    return;
  }

});

function showLocation() {
  if (!navigator.geolocation) {
    alert('現在地を取得できません');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(position) {

      map.setView([lat,lng],18);

        .openPopup();

async function createWaterSourceIfAbsent(record) {
  
if (!canEditNow() || !isAdminUser) {
  throw new Error("KMLの登録処理を停止しました");
}

  const recordRef = doc(db, importCollection, record.importId);
  const versionRef = doc(db, "water_metadata", "version");

  return await runTransaction(db, async (transaction) => {
    const existing = await transaction.get(recordRef);

    if (existing.exists()) {
      return false;
    }

    transaction.set(recordRef, {
  name: record.name,
  type: record.type,
  status: record.status,
  lat: record.lat,
  lng: record.lng
});

transaction.set(doc(collection(db, "water_changes")), {
  waterId: record.importId,
  action: "create",
  updatedAt: serverTimestamp()
});

transaction.set(doc(db, "water_latest_changes", record.importId), {
  waterId: record.importId,
  action: "create",
  updatedAt: serverTimestamp()
});

transaction.update(versionRef, {
  updatedAt: serverTimestamp()
});

    return true;
  });
}

    alert("管理者だけが削除できます");
    return;
  }

  try {
    const snapshot = await getDocs(collection(db, "water_sources"));

    const targets = snapshot.docs.filter(item =>
      item.id.startsWith("marifu_kml_")
    );

    if (targets.length === 0) {
      alert("削除対象のKMLデータはありません");
      return;
    }

    alert("削除対象は " + targets.length + " 件です");

    if (!confirm(
      "KMLデータ " + targets.length +
      " 件を削除します。\n本当によろしいですか？"
    )) {
      return;
    }

    if (!confirm(
      "最終確認です。\n削除したデータは元に戻せません。\n削除しますか？"
    )) {
      return;
    }

    let deleted = 0;

   
const batchSize = 3;

for (let i = 0; i < targets.length; i += batchSize) {
  if (!canEditNow()) return;
  const batch = writeBatch(db);
  const group = targets.slice(i, i + batchSize);

  for (const item of group) {
  batch.delete(doc(db, "water_sources", item.id));

  batch.set(doc(collection(db, "water_changes")), {
    waterId: item.id,
    action: "delete",
    updatedAt: serverTimestamp()
  });
batch.set(doc(db, "water_latest_changes", item.id), {
  waterId: item.id,
  action: "delete",
  updatedAt: serverTimestamp()
});
  }

  batch.update(doc(db, "water_metadata", "version"), {
    updatedAt: serverTimestamp()
  });

  try {
    await batch.commit();
    deleted += group.length;
  } catch (error) {
    alert(
      "削除を停止しました。\n" +
      "削除済み：" + deleted + " 件\n" +
      "エラー：" + error.message
    );
    return;
  }
}

localStorage.removeItem(WATER_CACHE_KEY);

    alert("KMLデータ " + deleted + " 件を削除しました");
    window.location.reload();

  } catch (error) {
    alert("削除処理エラー：" + error.message);
  }
});

  const WATER_CACHE_KEY = "marifu_water_sources_v1";
  const WATER_CACHE_DURATION = 24 * 60 * 60 * 1000;

function saveWaterCache(data, version = null) {
  try {
    localStorage.setItem(
      WATER_CACHE_KEY,
      JSON.stringify({
        savedAt: new Date().toISOString(),
uid: auth.currentUser?.uid,
version: version,
sources: data
      })
    );
  } catch (error) {
    console.error("水利データの保存に失敗:", error);
  }
}

function getWaterCache() {
  try {
    const saved = localStorage.getItem(WATER_CACHE_KEY);
    if (!saved) return null;

const cached = JSON.parse(saved);

if (!auth.currentUser ||
    cached.uid !== auth.currentUser.uid) {
  return null;
}

return cached;
  } catch (error) {
    console.error("保存データの読み込みに失敗:", error);
    return null;
  }
}
  function displayWaterSources(sources) {
  waterSourceMarkers.forEach((marker) => {
    map.removeLayer(marker);
  });

  waterSourceMarkers.clear();

  searchWaterSources = sources;

  sources.forEach((item) => {
    const doc = { id: item.id };
    const data = item;
      const type = data.type || "1";
　　　　const status = data.status || "0";
     const markerWeight = status === "3" ? 6 : status === "2" ? 4 : 2;
      console.log("水利データ確認:", doc.id, data);
　console.log("項目名の文字コード:", data.name, Object.keys(data).map(k => [k, [...k].map(c => c.charCodeAt(0))]));
      const lat = Number(data.lat);
　　　const lng = Number(data.lng);

if (!Number.isFinite(lat) || !Number.isFinite(lng) ||
    Math.abs(lat) > 90 || Math.abs(lng) > 180) {

}
     

     const marker = L.circleMarker([lat, lng], {

　color: status === "0" ? "white" : status === "3" ? "black" : status === "2" ? "yellow" : type === "2" ? "blue" : type === "3" ? "green" : "red",

  .addTo(map)

    );

    if (snapshot.metadata.fromCache) {
      throw new Error("最新データを取得できません");
    }

    const data = snapshot.docs.map(item => ({
      ...item.data(),
      id: item.id
    }));

    const backup = {
      savedAt: new Date().toISOString(),
      count: data.length,
      sources: data
    };

    const blob = new Blob(
      [JSON.stringify(backup, null, 2)],
      { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download = "麻里布分団_水利バックアップ_" +
      new Date().toISOString().replace(/[:.]/g, "-") +
      ".json";

    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    alert(data.length + "件の水利データを保存しました");

  } catch (error) {
    alert("バックアップに失敗しました：" + error.message);
  }
});

);

  item => !existingIds.has(item.id)
);

alert(
  "バックアップ確認完了\n" +
  "保存データ：" + backup.sources.length + "件\n" +
  "現在のデータ：" + snapshot.size + "件\n" +
  "復元対象：" + missingSources.length + "件"
);
if (missingSources.length === 0) {
  alert("復元する必要はありません");
  return;
}

if (!confirm(
  missingSources.length + "件の水利データを復元しますか？\n" +
  "既存の水利データは上書きしません。"
)) {
  return;
}
let restoredCount = 0;

for (const item of missingSources) {

if (!canEditNow() || !isAdminUser) {
  throw new Error("復元を停止しました。復元済み：" + restoredCount + "件");
}

  const restored = await runTransaction(db, async (transaction) => {

    const waterRef = doc(db, "water_sources", item.id);
    const versionRef = doc(db, "water_metadata", "version");
    const memberRef = doc(db, "members", auth.currentUser.uid);

    const memberSnap = await transaction.get(memberRef);
    const waterSnap = await transaction.get(waterRef);

    if (!memberSnap.exists() ||
        memberSnap.data().approved !== true ||
        memberSnap.data().role !== "admin") {
      throw new Error("管理者権限を確認できません");
    }

    if (waterSnap.exists()) {
      return false;
    }

    const { id, ...data } = item;

    transaction.set(waterRef, data);

transaction.set(doc(collection(db, "water_changes")), {
  waterId: item.id,
  action: "create",
  updatedAt: serverTimestamp()
});

transaction.set(doc(db, "water_latest_changes", item.id), {
  waterId: item.id,
  action: "create",
  updatedAt: serverTimestamp()
});

    transaction.update(versionRef, {
      updatedAt: serverTimestamp()
    });

    return true;

  });

  if (restored) {
    restoredCount++;
  }
}

alert(restoredCount + "件の水利データを復元しました");

await loadWaterSources();    
  } catch (error) {
    alert("ファイル確認エラー：" + error.message);
  }

});
  

async function loadWaterSources() {
  const loadingUserId = auth.currentUser?.uid;
  const loadingCheckId = memberCheckId;

  if (!loadingUserId) return;

  const cached = getWaterCache();


  try {
    const versionRef = doc(db, "water_metadata", "version");
    const versionSnap = await getDocFromServer(versionRef);

if (
  loadingCheckId !== memberCheckId ||
  auth.currentUser?.uid !== loadingUserId
) {
  return;
}

    const currentVersion = versionSnap.data()?.updatedAt;

    if (!(currentVersion instanceof Timestamp)) {
      throw new Error("更新日時を確認できません");
    }

    const oldVersion = cached?.version;

    const validCache =
      cached &&
      Array.isArray(cached.sources) &&
      oldVersion?.schema === 2 &&
      Number.isInteger(oldVersion.seconds) &&
      Number.isInteger(oldVersion.nanoseconds);

    const previousVersion = validCache
      ? new Timestamp(
          oldVersion.seconds,
          oldVersion.nanoseconds
        )
      : null;

    if (
      validCache &&
      previousVersion.isEqual(currentVersion)
    ) {
      console.log("保存済みの水利データを使用します");
      
window.waterDataLoadFailed = false;
updateOfflineWarning();

      displayWaterSources(cached.sources);
      return;
    }

    let sources;

    if (
      validCache &&
      previousVersion < currentVersion
    ) {
      const changes = await getDocsFromServer(
        query(
          collection(db, "water_latest_changes"),
          where("updatedAt", ">", previousVersion),
          where("updatedAt", "<=", currentVersion)
        )
      );

      const sourceMap = new Map(
        cached.sources.map(item => [item.id, item])
      );

      for (const change of changes.docs) {
        const data = change.data();
        const id = change.id;

        if (data.action === "delete") {
          sourceMap.delete(id);
        } else {
          const waterSnap = await getDocFromServer(
            doc(db, "water_sources", id)
          );

          if (!waterSnap.exists()) {
            throw new Error("水利情報が更新されています");
          }

          sourceMap.set(id, {
            ...waterSnap.data(),
            id: id
          });
        }
      }

      sources = Array.from(sourceMap.values());

      console.log(
        "差分更新件数:", changes.size
      );

    } else {
      const snapshot = await getDocsFromServer(
        collection(db, "water_sources")
      );

      sources = snapshot.docs.map(item => ({
        ...item.data(),
        id: item.id
      }));

      console.log("全件読み込み:", sources.length);
    }

    const checkSnap = await getDocFromServer(versionRef);
    
if (
  loadingCheckId !== memberCheckId ||
  auth.currentUser?.uid !== loadingUserId
) {
  return;
}

    const checkedAt = checkSnap.data()?.updatedAt;

    if (
      !(checkedAt instanceof Timestamp) ||
      !checkedAt.isEqual(currentVersion)
    ) {
      throw new Error(
        "読み込み中に更新がありました。再読み込みしてください。"
      );
    }

    saveWaterCache(sources, {
      schema: 2,
      seconds: currentVersion.seconds,
      nanoseconds: currentVersion.nanoseconds
    });

    displayWaterSources(sources);
    
window.waterDataLoadFailed = false;
updateOfflineWarning();

  } catch (error) {
   
if (
  loadingCheckId !== memberCheckId ||
  auth.currentUser?.uid !== loadingUserId
) {
  return;
}

    console.error("Firebase読み込みエラー:", error);

if (
  error.code === "permission-denied" ||
  error.code === "unauthenticated"
) {
  localStorage.removeItem(WATER_CACHE_KEY);
  canEditWaterSources = false;
  displayWaterSources([]);

  window.waterDataLoadFailed = true;

  const warning = document.getElementById("offlineWarning");

  if (warning) {
    warning.style.display = "block";
    warning.textContent =
      "⚠ 水利情報の閲覧権限を確認できません。";
  }

  alert("閲覧権限を確認できません。管理者にお問い合わせください。");
  return;
}

    
window.waterDataLoadFailed = true;

const warning = document.getElementById("offlineWarning");

if (warning) {
  warning.style.display = "block";
  warning.textContent =
    "⚠ 最新の水利情報を取得できません。";
}



    
const approvedAt = Number(
  localStorage.getItem("marifu_approved_" + loadingUserId)
);

const elapsed = Date.now() - approvedAt;

if (
  approvedAt > 0 &&
  elapsed >= 0 &&
  elapsed < WATER_CACHE_DURATION &&
  cached &&
  Array.isArray(cached.sources)
) {
  displayWaterSources(cached.sources);


      
      alert(
        "最新データを取得できませんでした。\n" +
        "保存済みの水利情報を表示します。\n" +
        "端末への保存日時：" +
        new Date(cached.savedAt).toLocaleString("ja-JP") +
        "\n※最新情報ではない可能性があります。"
      );

   
} else {
  displayWaterSources([]);

  if (warning) {
    warning.textContent =
      "⚠ 水利情報を閲覧できません。通信復旧後に再確認してください。";
  }

  alert(
    "水利情報を読み込めませんでした。\n" +
    "有効な保存済みデータがないか、閲覧期限を過ぎています。"
  );
}

  }
}

</script>

<script>


function updateOfflineWarning() {
  const warning = document.getElementById("offlineWarning");

  if (!warning) return;

  if (window.waterDataLoadFailed) {
    warning.style.display = "block";
  } else if (!navigator.onLine) {
    warning.style.display = "block";
    warning.textContent =
      "⚠ オフライン閲覧中：最新の水利情報ではない可能性があります。";
  } else {
    warning.style.display = "none";
  }
}


window.addEventListener("online", updateOfflineWarning);

window.addEventListener("offline", () => {
  window.waterDataLoadFailed = true;

  const warning = document.getElementById("offlineWarning");

  if (warning) {
    warning.textContent =
      "⚠ オフライン閲覧中：最新の水利情報ではない可能性があります。";
  }

  updateOfflineWarning();
});


updateOfflineWarning();


  if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => {
        console.log("オフライン起動設定完了");
      })
      .catch(error => {
        console.error("オフライン起動設定エラー:", error);
      });
  });
}
</script>
